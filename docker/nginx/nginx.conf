events {}

http {
  # Hide nginx version in the Server header (closes the T13 version leak)
  server_tokens off;

  upstream api { server api:5000; }

  # Redirect plain HTTP to HTTPS
  server {
    listen 80;
    server_name localhost;
    return 301 https://$host:8443$request_uri;
  }

  # HTTPS
  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Transport + content security headers at the edge
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Drop the backend's Server header; nginx emits only "Server: nginx" (no version)
    proxy_hide_header Server;

    location / {
      proxy_pass http://api;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
