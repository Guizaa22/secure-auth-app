name: CI — tests & security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt gunicorn
          pip install pytest pytest-cov bandit pip-audit

      - name: Generate test signing keys
        run: |
          mkdir -p keys
          openssl genpkey -algorithm ed25519 -out keys/signing_key.pem
          openssl pkey -in keys/signing_key.pem -pubout -out keys/signing_pub.pem
          openssl ecparam -name prime256v1 -genkey -noout -out keys/jwt_ec_key.pem
          openssl ec -in keys/jwt_ec_key.pem -pubout -out keys/jwt_ec_pub.pem

      - name: Run test suite
        run: pytest -q

      - name: Static security scan (bandit)
        run: bandit -r app -ll

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit || true   # report-only: dependency CVEs shouldn't block the build

      - name: Build Docker image
        run: docker build -t secure-notes-api:ci .
