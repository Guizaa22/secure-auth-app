# Opt-in overlay. Run with:
#   docker compose -f docker-compose.yml -f docker-compose.vault.yml up --build -d
services:
  vault:
    image: hashicorp/vault:1.17
    container_name: secure-notes-vault
    cap_add: ["IPC_LOCK"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"          # DEMO ONLY — never a fixed root token in production
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "127.0.0.1:8200:8200"
    command: ["server", "-dev"]

  vault-seed:
    image: secure-notes-api:latest
    depends_on:
      vault:
        condition: service_started
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"
    entrypoint: ["python", "scripts/vault_seed.py"]
    restart: "no"

  api:
    depends_on:
      vault-seed:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"
